[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "knowledge/index"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: hits a real LLM provider; skipped without an API key",
]
